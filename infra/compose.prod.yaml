name: recruiting-help

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 512m
    cpus: 0.5
    restart: unless-stopped
    networks:
      - backend

  n8n:
    image: ${N8N_IMAGE:?Set N8N_IMAGE to a pinned image tag}
    depends_on:
      postgres:
        condition: service_healthy
      intake-api:
        condition: service_healthy
      processor:
        condition: service_healthy
      discord-bot:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:?Set POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_HOST: ${N8N_HOST:-127.0.0.1}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-America/Los_Angeles}
      TZ: ${GENERIC_TIMEZONE:-America/Los_Angeles}
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ../n8n/workflows:/repo-workflows:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:5678/healthz'').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"',
        ]
      interval: 15s
      timeout: 5s
      retries: 12
    mem_limit: 768m
    cpus: 0.75
    restart: unless-stopped
    networks:
      - backend
      - egress

  intake-api:
    image: ${INTAKE_API_IMAGE:-recruiting-help/intake-api:development}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: ${AGGREGATOR_DATABASE_URL:?Set AGGREGATOR_DATABASE_URL}
      AGGREGATOR_CALLERS_JSON: ${AGGREGATOR_CALLERS_JSON:?Set AGGREGATOR_CALLERS_JSON}
      PORT: 3000
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:3000/readyz'').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"',
        ]
      interval: 15s
      timeout: 5s
      retries: 12
    mem_limit: 256m
    cpus: 0.25
    restart: unless-stopped
    networks:
      - backend

  processor:
    image: ${PROCESSOR_IMAGE:-recruiting-help/processor:development}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: ${AGGREGATOR_DATABASE_URL:?Set AGGREGATOR_DATABASE_URL}
      PORT: 3001
      FEED_DESTINATION_KEY: ${FEED_DESTINATION_KEY:-internship-feed}
      AUTO_PUBLISH_CONFIDENCE: ${AUTO_PUBLISH_CONFIDENCE:-0.85}
      RESOLVE_REDIRECTS: ${RESOLVE_REDIRECTS:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Set GEMINI_API_KEY}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:3001/readyz'').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"',
        ]
      interval: 15s
      timeout: 5s
      retries: 12
    mem_limit: 384m
    cpus: 0.5
    restart: unless-stopped
    networks:
      - backend
      - egress

  discord-bot:
    image: ${DISCORD_BOT_IMAGE:-recruiting-help/discord-bot:development}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: ${AGGREGATOR_DATABASE_URL:?Set AGGREGATOR_DATABASE_URL}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:?Set DISCORD_BOT_TOKEN}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:?Set DISCORD_GUILD_ID}
      DISCORD_INTAKE_CHANNEL_ID: ${DISCORD_INTAKE_CHANNEL_ID:?Set DISCORD_INTAKE_CHANNEL_ID}
      DISCORD_FEED_CHANNEL_ID: ${DISCORD_FEED_CHANNEL_ID:?Set DISCORD_FEED_CHANNEL_ID}
      DISCORD_REVIEW_CHANNEL_ID: ${DISCORD_REVIEW_CHANNEL_ID:?Set DISCORD_REVIEW_CHANNEL_ID}
      DISCORD_OPS_CHANNEL_ID: ${DISCORD_OPS_CHANNEL_ID:?Set DISCORD_OPS_CHANNEL_ID}
      INTAKE_URL: http://intake-api:3000/v1/events
      AGGREGATOR_CALLER_ID: ${DISCORD_BOT_CALLER_ID:-discord-bot}
      AGGREGATOR_CALLER_SECRET: ${DISCORD_BOT_CALLER_SECRET:?Set DISCORD_BOT_CALLER_SECRET}
      PORT: 3002
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:3002/readyz'').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"',
        ]
      interval: 15s
      timeout: 5s
      retries: 12
    mem_limit: 256m
    cpus: 0.25
    restart: unless-stopped
    networks:
      - backend
      - egress

  collector:
    image: ${COLLECTOR_IMAGE:-recruiting-help/collector:development}
    profiles: ["application"]
    depends_on:
      n8n:
        condition: service_healthy
    environment:
      NODE_ENV: production
      INTAKE_HMAC_SECRET: ${INTAKE_HMAC_SECRET:?Set INTAKE_HMAC_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Set GEMINI_API_KEY}
      N8N_INTAKE_URL: http://n8n:5678/webhook/unified-intake
      BROWSER_PROFILE_ROOT: /var/lib/recruiting-help/browser-profiles
      DIAGNOSTICS_ROOT: /var/lib/recruiting-help/diagnostics
      MAX_CONCURRENT_BROWSERS: "1"
    volumes:
      - browser_profiles:/var/lib/recruiting-help/browser-profiles
      - temporary_diagnostics:/var/lib/recruiting-help/diagnostics
    shm_size: 1gb
    mem_limit: 2g
    cpus: 1.5
    restart: unless-stopped
    networks:
      - backend
      - egress

volumes:
  postgres_data:
  n8n_data:
  browser_profiles:
  temporary_diagnostics:

networks:
  backend:
    internal: true
  egress:
