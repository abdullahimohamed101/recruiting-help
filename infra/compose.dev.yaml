name: recruiting-help-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-recruiting_help}
      POSTGRES_USER: ${POSTGRES_USER:-recruiting_help}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-recruiting_help} -d ${POSTGRES_DB:-recruiting_help}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  n8n:
    image: ${N8N_IMAGE:-docker.n8n.io/n8nio/n8n:latest}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-recruiting_help}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-recruiting_help}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-local-development-key-replace-before-use}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-America/Los_Angeles}
      TZ: ${GENERIC_TIMEZONE:-America/Los_Angeles}
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ../n8n/workflows:/repo-workflows:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:5678/healthz'').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 18
    restart: unless-stopped

  intake-api:
    build:
      context: ..
      dockerfile: apps/intake-api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-recruiting_help}:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/${POSTGRES_DB:-recruiting_help}
      AGGREGATOR_CALLERS_JSON: ${AGGREGATOR_CALLERS_JSON:-{"collector-dev":{"secret":"development-only-hmac-secret-replace-before-shared-use","allowed_sources":{"github":["vanshb03/Summer2027-Internships"]}},"discord-bot-dev":{"secret":"development-only-hmac-secret-replace-before-shared-use","allowed_sources":{"discord_manual":["replace-with-discord-guild-id"],"slack_manual":["discord-intake"],"instagram_manual":["discord-intake"]}}}}
      PORT: 3000
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:3000/readyz'').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  processor:
    build:
      context: ..
      dockerfile: apps/processor/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-recruiting_help}:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/${POSTGRES_DB:-recruiting_help}
      PORT: 3001
      FEED_DESTINATION_KEY: ${FEED_DESTINATION_KEY:-internship-feed}
      AUTO_PUBLISH_CONFIDENCE: ${AUTO_PUBLISH_CONFIDENCE:-0.85}
      RESOLVE_REDIRECTS: ${RESOLVE_REDIRECTS:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:3001/readyz'').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  discord-bot:
    profiles: ["discord"]
    build:
      context: ..
      dockerfile: apps/discord-bot/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      intake-api:
        condition: service_healthy
      n8n:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-recruiting_help}:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/${POSTGRES_DB:-recruiting_help}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:?Set DISCORD_BOT_TOKEN to enable the discord profile}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:?Set DISCORD_GUILD_ID}
      DISCORD_INTAKE_CHANNEL_ID: ${DISCORD_INTAKE_CHANNEL_ID:?Set DISCORD_INTAKE_CHANNEL_ID}
      DISCORD_FEED_CHANNEL_ID: ${DISCORD_FEED_CHANNEL_ID:?Set DISCORD_FEED_CHANNEL_ID}
      DISCORD_REVIEW_CHANNEL_ID: ${DISCORD_REVIEW_CHANNEL_ID:?Set DISCORD_REVIEW_CHANNEL_ID}
      DISCORD_OPS_CHANNEL_ID: ${DISCORD_OPS_CHANNEL_ID:?Set DISCORD_OPS_CHANNEL_ID}
      INTAKE_URL: ${INTAKE_URL:-http://n8n:5678/webhook/unified-intake}
      AGGREGATOR_CALLER_ID: ${DISCORD_BOT_CALLER_ID:-discord-bot-dev}
      AGGREGATOR_CALLER_SECRET: ${AGGREGATOR_CALLER_SECRET:-development-only-hmac-secret-replace-before-shared-use}
      PORT: 3002
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:3002/readyz'').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 18
    restart: unless-stopped

volumes:
  postgres_data:
  n8n_data:
